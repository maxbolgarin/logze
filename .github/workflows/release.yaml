name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # semantic-release@25 and @semantic-release/github@12 require Node ^22.14
          node-version: '22'

      - name: Install semantic-release
        # Majors are pinned: unpinned installs break whenever semantic-release
        # ships a major with new Node requirements.
        # @semantic-release/npm is not installed: .releaserc.json lists the
        # plugins explicitly and this Go module never publishes to npm.
        run: |
          npm install -g semantic-release@25
          npm install -g @semantic-release/github@12
          npm install -g conventional-changelog-conventionalcommits@10

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
